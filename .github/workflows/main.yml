name: Update Kora M3U
on:
  schedule:
    - cron: '*/15 * * * *'  # كل 15 دقيقة
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: |
          python3 << 'PY'
          import requests, re, base64, uuid, time
          def fetch(ch):
              src=f"https://a11.kora-plus.li/frame.php?ch={ch}&p=12&token={uuid.uuid4()}&kt={int(time.time())}"
              h={"Referer":"https://robotiva.online/","Sec-Fetch-Dest":"iframe","User-Agent":"Mozilla/5.0"}
              r=requests.get(src, headers=h, timeout=15)
              m=re.search(r'aHR0[^"]+', r.text)
              b64=m.group(0).replace('-','+').replace('_','/')
              b64+='='*(-len(b64)%4)
              return base64.b64decode(b64).decode()
          b4=fetch("b4"); tv6=fetch("tv6")
          open("kora-live.m3u8","w").write(f"""#EXTM3U
          #EXTINF:-1,beIN Sport 4
          {b4}
          #EXTINF:-1,Sport TV 6
          {tv6}
          """)
          print(b4); print(tv6)
          PY
      - run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add kora-live.m3u8
          git diff --staged --quiet || (git commit -m "update kora $(date -u)" && git push)
