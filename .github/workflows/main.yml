name: Update Kora M3U
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 << 'PY'
          import os
          # قناة 786431 فقط — تمت إزالة beIN Sport 4 و Sport TV 6 نهائياً من قائمة Kora
          content = (
              '#EXTM3U\n'
              '#EXTINF:-1 tvg-name="786431" group-title="مباريات مباشرة" tvg-logo="⚽",786431\n'
              'https://passive-rotunda-deduct.ngrok-free.dev/my_restream.m3u8\n'
          )
          with open("kora-live.m3u8", "w", encoding="utf-8") as f:
              f.write(content)
          os.makedirs("public", exist_ok=True)
          with open("public/kora-live.m3u8", "w", encoding="utf-8") as f:
              f.write(content)
          print(content)
          PY
      - run: |
          git config user.name "kora-bot"
          git config user.email "bot@github.com"
          git add kora-live.m3u8 public/kora-live.m3u8
          git diff --staged --quiet || (git commit -m "update kora $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
