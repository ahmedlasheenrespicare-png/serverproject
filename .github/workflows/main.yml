name: Update Kora M3U
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: |
          python3 << 'PY'
          import requests, re, base64, uuid, time, os
          def fetch(ch):
              src=f"https://a11.kora-plus.li/frame.php?ch={ch}&p=12&token={uuid.uuid4()}&kt={int(time.time())}"
              h={"Referer":"https://robotiva.online/","Origin":"https://robotiva.online","Sec-Fetch-Dest":"iframe","Sec-Fetch-Mode":"navigate","Sec-Fetch-Site":"cross-site","User-Agent":"Mozilla/5.0","Accept":"text/html,application/xhtml+xml"}
              r=requests.get(src, headers=h, timeout=15)
              m=re.search(r'aHR0[^"]+', r.text)
              b64=m.group(0).replace('-','+').replace('_','/')
              b64+='='*(-len(b64)%4)
              return base64.b64decode(b64).decode()
          b4=fetch("b4"); tv6=fetch("tv6")
          content=f'''#EXTM3U
          #EXTINF:-1 tvg-name="beIN Sport 4" tvg-logo="https://a11.kora-plus.li/favicon.ico" group-title="مباريات مباشرة",beIN Sport 4
          {b4}
          #EXTINF:-1 tvg-name="Sport TV 6" tvg-logo="https://a11.kora-plus.li/favicon.ico" group-title="مباريات مباشرة",Sport TV 6
          {tv6}
          '''
          open("kora-live.m3u8","w",encoding="utf-8").write(content)
          os.makedirs("public", exist_ok=True)
          open("public/kora-live.m3u8","w",encoding="utf-8").write(content)
          print(content)
          PY
      - run: |
          git config user.name "kora-bot"
          git config user.email "bot@github.com"
          git add kora-live.m3u8 public/kora-live.m3u8
          git diff --staged --quiet || (git commit -m "update kora $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)
