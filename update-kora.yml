name: Update Kora M3U

on:
  schedule:
    - cron: '*/15 * * * *'  # كل 15 دقيقة
  workflow_dispatch:  # تشغيل يدوي من تبويب Actions
  push:
    paths:
      - '.github/workflows/update-kora.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ملاحظة: هذا الملف نسخة قديمة غير مُفعَّلة (الـ workflow الفعلي في .github/workflows/main.yml)
      # تم تحديثه أيضاً حتى لا يعيد إضافة beIN Sport 4 و Sport TV 6
      - name: Write kora-live.m3u8 (channel 786431 only)
        run: |
          python3 << 'PY'
          import os
          content = (
              '#EXTM3U\n'
              '#EXTINF:-1 tvg-name="786431" group-title="مباريات مباشرة" tvg-logo="⚽",786431\n'
              'https://passive-rotunda-deduct.ngrok-free.dev/my_restream.m3u8\n'
          )
          with open("kora-live.m3u8", "w", encoding="utf-8") as f:
              f.write(content)
          os.makedirs("public", exist_ok=True)
          with open("public/kora-live.m3u8", "w", encoding="utf-8") as f:
              f.write(content)
          print(content)
          PY
          cat kora-live.m3u8

      - name: Commit and push
        run: |
          git config user.name "kora-bot"
          git config user.email "bot@github.com"
          git add kora-live.m3u8 public/kora-live.m3u8
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "update kora $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
